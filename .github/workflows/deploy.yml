name: Публикация на GitHub Pages

# Правило окружения github-pages пускает деплой только с дефолтной ветки
# репозитория, поэтому здесь перечислены обе: как только дефолтной станет
# main, вторую строку можно убрать.
on:
  push:
    branches: [main, claude/peaceful-hypatia-47zlbe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
